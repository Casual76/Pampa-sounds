// Puro Kotlin/JVM, zero Android: tutta la matematica del fonometro (FFT, pesature A/C, costanti di
// tempo, statistiche, dose, bande, calibrazione) si compila e si prova sul computer. Qualsiasi
// dipendenza Android aggiunta qui e' un errore di architettura, non una comodita'.
plugins {
  id 'org.jetbrains.kotlin.jvm'
}

apply from: "${rootDir}/engine/versions.gradle"

kotlin {
  jvmToolchain(17)
}

dependencies {
  testImplementation "junit:junit:${engine.junit}"
}
