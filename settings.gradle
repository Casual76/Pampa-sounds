// --- fluid-engine (inizio) ---
def engineDir = file('engine')
if (engineDir.exists()) {
  [
   'engine-foundation',
   'engine-ui',
   'engine-storage',
   'engine-net',
   'engine-update'
  ].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(engineDir, name)
  }
}
